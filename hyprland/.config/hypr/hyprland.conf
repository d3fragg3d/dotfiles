# ==================================================
# Chris King - Hyprland v1
# Arch Linux / Laptop / Catppuccin Base
# ==================================================

################
# MONITORS
################

monitor=,preferred,auto,1

################
# COLOURS
# Defaults — overridden by colors.conf when wallust has run
################

$accent          = rgb(c4956a)
$border_inactive = rgb(252525)
source = ~/.config/hypr/colors.conf

################
# VARIABLES
################

$mainMod = SUPER
$terminal = kitty
$fileManager = thunar
$menu = fuzzel
$browser = zen-browser

################
# AUTOSTART
################

exec-once = ~/.config/hypr/scripts/wallpaper.sh
exec-once = waybar
exec-once = swaync
exec-once = /usr/lib/hyprpolkitagent/hyprpolkitagent
exec-once = hypridle
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = bash -c 'while true; do ~/.config/hypr/scripts/battery-check.sh; sleep 120; done'
exec-once = hyprswitch init --show-title &
exec-once = swayosd-server
exec-once = ~/.config/hypr/scripts/syncthing-notify.sh

################
# ENVIRONMENT
################

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = QT_QPA_PLATFORM,wayland
env = QT_QPA_PLATFORMTHEME,qt5ct
env = GDK_BACKEND,wayland,x11

################
# GENERAL
################

general {
    gaps_in = 6
    gaps_out = 12

    border_size = 2

    col.active_border = $accent
    col.inactive_border = $border_inactive

    resize_on_border = true
    allow_tearing = false

    layout = dwindle
}

################
# DECORATION
################

decoration {
    rounding = 10
    rounding_power = 2

    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 8
        render_power = 3
        color = rgba(0a0906ee)
    }

    blur {
        enabled = true
        size = 5
        passes = 2
        vibrancy = 0.15
    }
}

################
# ANIMATIONS
################

animations {
    enabled = yes

    bezier = smooth, 0.22, 0.9, 0.3, 1.0
    bezier = soft,   0.25, 0.8, 0.25, 1.0
    bezier = quick,  0.15, 0.0, 0.1, 1.0

    animation = windows,      1, 6, smooth
    animation = windowsIn,    1, 6, smooth, popin 85%
    animation = windowsOut,   1, 5, soft, popin 85%
    animation = border,       1, 8, default
    animation = fade,         1, 6, soft
    animation = workspaces,   1, 6, smooth
    animation = layers,       1, 5, smooth
    animation = specialWorkspace, 1, 6, smooth, slidevert
}

################
# LAYOUTS
################

dwindle {
    preserve_split = true
}

master {
    new_status = master
}

################
# INPUT
################

input {
    kb_layout = gb
    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = true
        tap-to-click = true
        drag_lock = false
        clickfinger_behavior = true
        scroll_factor = 1.0
    }
}

################
# KEYBINDS
################

# Apps
bind = $mainMod, Return, exec, $terminal # Open terminal
bind = $mainMod, E, exec, $fileManager # Open file manager
bind = $mainMod, R, exec, $menu # Open app launcher
bind = $mainMod SHIFT, L, exec, hyprlock # Lock screen
bind = $mainMod, C, exec, swaync-client -t # Toggle notification center
bind = $mainMod SHIFT, N, exec, ~/.config/hypr/scripts/nightmode.sh # Toggle night mode (blue light filter)
bind = $mainMod, N, exec, ~/.config/hypr/scripts/nvim-workspace.sh # Open Neovim workspace
bind = $mainMod, slash, exec, ~/.config/hypr/scripts/scratchpad.sh # Toggle scratchpad terminal
bind = $mainMod SHIFT, slash, exec, ~/.config/hypr/scripts/keybind-search.sh # Search keybindings by what they do and run them
bind = $mainMod, S, exec, ~/.config/hypr/scripts/obsidian-scratch.sh # Open Obsidian scratch note
bind = $mainMod SHIFT, I, exec, ~/.config/hypr/scripts/sleep-inhibit-toggle.sh # Toggle automatic sleep on/off

# Windows
bind = $mainMod, Q, killactive # Close active window
bind = $mainMod SHIFT, Q, forcekillactive # Force close unresponsive window
bind = $mainMod, F, fullscreen, 1 # Toggle fullscreen
bind = $mainMod, Space, exec, hyprctl dispatch togglefloating && hyprctl dispatch resizeactive exact 60% 60% && hyprctl dispatch centerwindow # Toggle floating and center window
bind = $mainMod SHIFT, Space, centerwindow # Center floating window
bind = $mainMod SHIFT, E, exit # Exit Hyprland session (log out)
bind = $mainMod, H, resizeactive, -80 0 # Shrink window width
bind = $mainMod, L, resizeactive, 80 0 # Grow window width
bind = $mainMod, K, resizeactive, 0 -80 # Shrink window height
bind = $mainMod, J, resizeactive, 0 80 # Grow window height

# Focus movement
#bind = SHIFT, left, movefocus, l
#bind = SHIFT, down, movefocus, d
#bind = SHIFT, up, movefocus, u
#bind = SHIFT, right, movefocus, r

# Workspace cycling
bind = $mainMod, right, workspace, e+1 # Switch to next workspace
bind = $mainMod, left, workspace, e-1 # Switch to previous workspace
bind = $mainMod, TAB, workspace, previous # Switch to last used workspace

# Numbered workspaces
bind = $mainMod, 1, workspace, 1 # Switch to workspace 1
bind = $mainMod, 2, workspace, 2 # Switch to workspace 2
bind = $mainMod, 3, workspace, 3 # Switch to workspace 3
bind = $mainMod, 4, workspace, 4 # Switch to workspace 4
bind = $mainMod, 5, workspace, 5 # Switch to workspace 5

# Move windows to workspaces
bind = $mainMod SHIFT, 1, movetoworkspace, 1 # Move window to workspace 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2 # Move window to workspace 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3 # Move window to workspace 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4 # Move window to workspace 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5 # Move window to workspace 5

# Mouse workspace switching
bind = $mainMod, mouse_down, workspace, e+1 # Scroll to next workspace
bind = $mainMod, mouse_up, workspace, e-1 # Scroll to previous workspace

# Mouse move/resize
bindm = $mainMod, mouse:272, movewindow # Drag window with mouse
bindm = $mainMod, mouse:273, resizewindow # Resize window with mouse

# Clipboard
bind = $mainMod, V, exec, cliphist list | fuzzel --dmenu | cliphist decode | wl-copy # Open clipboard history

# Window switcher
bind = ALT, Tab, exec, hyprswitch gui --mod-key alt --key tab --close mod-key-release # Switch windows (alt-tab)
bind = ALT SHIFT, Tab, exec, hyprswitch gui --mod-key alt --key tab --close mod-key-release --reverse-key=shift # Switch windows backwards


# Screenshot
bind = $mainMod SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy && notify-send "Screenshot" "Copied to clipboard" # Screenshot region to clipboard
bind = $mainMod CTRL, S, exec, grim -g "$(slurp)" ~/Pictures/Screenshots/$(date +'%Y-%m-%d_%H-%M-%S').png && notify-send "Screenshot" "Saved to Pictures/Screenshots" # Screenshot region to file
bind = , Print, exec, grim - | wl-copy # Screenshot full screen to clipboard
#bind = SHIFT, Print, exec, grim ~/Pictures/Screenshots/$(date +'%Y-%m-%d_%H-%M-%S').png
bind = $mainMod ALT, S, exec, grim -g "$(slurp)" - | swappy -f - # Screenshot region and annotate

# Color picker — copies hex to clipboard
bind = $mainMod, P, exec, hyprpicker -a && notify-send "Colour Picker" "Colour copied to clipboard" # Pick color from screen

# Btop system monitor
bind = $mainMod, B, exec, ~/.config/hypr/scripts/btop-toggle.sh # Toggle floating system monitor

################
# WINDOW RULES
################

windowrule = match:float 1, center 1

# Scratchpad terminal
windowrule = match:class ^(scratchpad)$, float 1
windowrule = match:class ^(scratchpad)$, workspace special:scratchpad silent
windowrule = match:class ^(scratchpad)$, border_size 0

# Network passphrase prompt
windowrule = match:title ^(network-connect)$, float 1
windowrule = match:title ^(network-connect)$, size 500 200
windowrule = match:title ^(network-connect)$, center 1

# Calendar popup — float below the clock, fixed size, no animation
windowrule = match:class ^(calendar)$, float 1
windowrule = match:class ^(calendar)$, size 440 320
windowrule = match:class ^(calendar)$, move 740 52

# Btop floating monitor
windowrule = match:class ^(btop-float)$, float 1
windowrule = match:class ^(btop-float)$, center 1


################
# MEDIA KEYS
################

bindel = ,XF86AudioRaiseVolume, exec, swayosd-client --output-volume raise # Raise volume
bindel = ,XF86AudioLowerVolume, exec, swayosd-client --output-volume lower # Lower volume
bindel = ,XF86AudioMute, exec, swayosd-client --output-volume mute-toggle # Mute/unmute volume
bindel = ,XF86AudioMicMute, exec, swayosd-client --input-volume mute-toggle # Mute/unmute microphone

bindel = ,XF86MonBrightnessUp, exec, swayosd-client --brightness raise # Increase screen brightness
bindel = ,XF86MonBrightnessDown, exec, swayosd-client --brightness lower # Decrease screen brightness

bindl = ,XF86AudioNext, exec, playerctl next # Next track
bindl = ,XF86AudioPrev, exec, playerctl previous # Previous track
bindl = ,XF86AudioPlay, exec, playerctl play-pause # Play/pause media
bindl = ,XF86AudioPause, exec, playerctl play-pause # Play/pause media

################
# MISC
################

misc {
    disable_hyprland_logo = true
    force_default_wallpaper = 0
}


