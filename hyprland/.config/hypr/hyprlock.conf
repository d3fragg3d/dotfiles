background {
    monitor =
    path = /home/chris/Pictures/mountain.jpg
    blur_passes = 3
    blur_size = 7
    brightness = 0.6
    contrast = 0.9
    vibrancy = 0.15
}

# Clock
label {
    monitor =
    text = cmd[update:1000] echo "$(date '+%H:%M')"
    color = rgba(e8d5bfff)
    font_size = 90
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 120
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:1000] echo "$(date '+%A, %d %B')"
    color = rgba(d4b483ff)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, 28
    halign = center
    valign = center
}

# Password input
input-field {
    monitor =
    size = 280, 52
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    outer_color = rgba(d4b483ff)
    inner_color = rgba(1a1512ff)
    font_color = rgba(e8d5bfff)
    check_color = rgba(8aab88ff)
    fail_color = rgba(c46a6aff)
    fail_text = Incorrect ($ATTEMPTS)
    fade_on_empty = true
    rounding = 12
    placeholder_text = Password...
    position = 0, -80
    halign = center
    valign = center
}
