# Colors managed by wallust — do not edit manually
include colors.conf

# Report as xterm-256color instead of xterm-kitty — most remote hosts (SSH,
# appliances like TrueNAS) lack kitty's terminfo, breaking tmux/backspace/etc.
term xterm-256color

# Font
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        10.0

# Transparency — shows wallpaper through terminal
background_opacity 0.85
dynamic_background_opacity yes

# Padding
window_padding_width 8

# Don't ask to confirm before closing
confirm_os_window_close 0

# Required for wallust to reload colours live
allow_remote_control socket-only
listen_on unix:/tmp/kitty
